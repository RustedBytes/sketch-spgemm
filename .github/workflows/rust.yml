name: Rust

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "python/src/**"
      - "python/Cargo.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - ".github/workflows/rust.yml"
      - ".github/workflows/version-bump.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "python/src/**"
      - "python/Cargo.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "clippy.toml"
      - ".clippy.toml"
      - ".github/workflows/rust.yml"
      - ".github/workflows/version-bump.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.91", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test workspace and optional integrations
        run: cargo test --locked --workspace --all-features
      - name: Test minimal core
        run: cargo test --locked --no-default-features

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test version automation
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"
      - run: cargo fmt --all --check
      # Existing warnings are reported without blocking focused changes.
      - run: cargo clippy --locked --workspace --all-targets --all-features
