[package]
name = "sketch-spgemm"
version = "0.9.0"
edition = "2021"
rust-version = "1.91"
autobins = false
description = "Adaptive SketchSpGEMM with low-overhead auto selection and fused residual fingerprints"
license = "MIT"
repository = "https://github.com/RustedBytes/sketch-spgemm"
documentation = "https://docs.rs/sketch-spgemm"
readme = "README.md"
keywords = ["spgemm", "sparse-matrix", "linear-algebra", "sketching", "algorithms"]
categories = ["algorithms", "data-structures", "mathematics", "science"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
sprs = ["dep:sprs"]
petgraph = ["dep:petgraph", "petgraph/stable_graph"]

[lib]
name = "sketch_spgemm"
path = "src/lib.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "sprs"
path = "examples/sprs.rs"
required-features = ["sprs"]

[[example]]
name = "petgraph"
path = "examples/petgraph.rs"
required-features = ["petgraph"]

[[example]]
name = "benchmark-sprs"
path = "examples/benchmark_sprs.rs"
required-features = ["sprs"]

[[example]]
name = "benchmark-petgraph"
path = "examples/benchmark_petgraph.rs"
required-features = ["petgraph"]

[profile.release]
lto = "thin"
codegen-units = 1

[dependencies]
petgraph = { version = "0.8.3", optional = true, default-features = false }
sprs = { version = "0.11.5", optional = true, default-features = false }
