name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component to increment (ignored when version is supplied)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit MAJOR.MINOR.PATCH version
        type: string
        required: false

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Prepare synchronized version and changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: python .github/scripts/bump_version.py --bump "$BUMP" --version "$VERSION"
      - name: Refresh Cargo lockfile and validate
        run: |
          python -m unittest discover -s .github/scripts -p "test_*.py"
          cargo metadata --format-version 1 > /dev/null
          cargo test --locked --workspace --all-features
          git diff --check
      - name: Create version PR and dispatch its checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="chore/version-$VERSION"
          git ls-remote origin "refs/heads/$branch" "refs/tags/v$VERSION" > /tmp/version-refs
          if test -s /tmp/version-refs; then
            echo "Version branch or tag already exists: $VERSION"
            exit 1
          fi
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml python/Cargo.toml pyproject.toml Cargo.lock python/src/lib.rs changelog.md
          git commit -m "chore: bump version to $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: bump version to $VERSION" --body "Synchronize Rust and Python versions, Cargo.lock and changelog. Rust workspace tests passed in the version workflow. Rust and Python CI are explicitly dispatched for this branch. No tag or release is created."
          # Explicit dispatch also works for a branch pushed with GITHUB_TOKEN.
          gh workflow run rust.yml --ref "$branch"
          gh workflow run python.yml --ref "$branch"
