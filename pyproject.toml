[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sketch-spgemm"
version = "0.11.0"
description = "Python bindings for adaptive sketch-based sparse matrix multiplication"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "pyright>=1.1.405", "ruff>=0.13"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
python-source = "python"
module-name = "sketch_spgemm._sketch_spgemm"
bindings = "pyo3"
exclude = [".pytest_cache/**", "python/**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
include = ["python/sketch_spgemm", "python/tests"]
extraPaths = ["python"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
reportMissingModuleSource = false
